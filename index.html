<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HG Loading Screen</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <script src="config.js"></script>
</head>
<body>

    <div class="hud-frame" aria-hidden="true">
        <span class="corner corner-tl"></span>
        <span class="corner corner-tr"></span>
        <span class="corner corner-bl"></span>
        <span class="corner corner-br"></span>
    </div>

    <div class="background-container">
        <div id="bg-media"></div>
        <div class="grain" aria-hidden="true"></div>
        <div class="scanline" aria-hidden="true"></div>
        <div class="overlay"></div>
    </div>

    <!-- Left console panel -->
    <aside class="panel">
        <div class="panel-top">
            <span class="eyebrow">
                <i class="fa-solid fa-satellite-dish" aria-hidden="true"></i>
                <span id="server-eyebrow"></span>
            </span>
        </div>

        <div class="panel-mid">
            <div class="logo-container">
                <img id="server-logo" src="" data-i18n-alt="serverLogoAlt" alt="Server Logo">
            </div>
            <h2 id="server-name"></h2>
            <div class="panel-divider"></div>
        </div>

        <div class="panel-bottom">
            <div class="social-links" id="social-links"></div>

            <div class="announce-slider" id="announce-slider">
                <div class="announce-track" id="announce-track"></div>
                <div class="announce-dots" id="announce-dots"></div>
            </div>
        </div>
    </aside>

    <!-- Top-right actions: info center + language switcher, merged into one control group -->
    <div class="top-bar-actions">
        <div class="control-group">
            <button class="panel-toggle-btn" id="info-btn" type="button">
                <i class="fa-solid fa-circle-info"></i>
                <span data-i18n="infoCenterBtn">Info Center</span>
            </button>

            <div class="control-divider"></div>

            <div class="lang-switcher" id="lang-switcher">
                <button class="lang-toggle-btn" id="lang-btn" type="button" aria-label="Language">
                    <i class="fa-solid fa-globe"></i>
                </button>
                <div class="lang-dropdown" id="lang-dropdown"></div>
            </div>
        </div>
    </div>

    <div class="side-panel info-panel" id="info-panel">
        <div class="sidebar-header">
            <div class="sidebar-heading">
                <span class="sidebar-eyebrow" data-i18n="infoCenterEyebrow">Server Information</span>
                <h3 data-i18n="infoCenterTitle">Info Center</h3>
            </div>
            <i class="fa-solid fa-xmark close-btn" id="info-close-btn"></i>
        </div>

        <div class="panel-tabs">
            <button class="panel-tab active" data-tab="staff" type="button">
                <i class="fa-solid fa-address-card"></i> <span data-i18n="tabStaff">Staff</span>
            </button>
            <button class="panel-tab" data-tab="changelog" type="button">
                <i class="fa-solid fa-bullhorn"></i> <span data-i18n="tabUpdates">Updates</span>
            </button>
        </div>

        <div class="tab-panel active" id="tab-staff">
            <div class="staff-list" id="staff-list"></div>
        </div>
        <div class="tab-panel" id="tab-changelog">
            <div class="changelog-list" id="changelog-list"></div>
        </div>
    </div>

    <!-- Bottom status bar -->
    <div class="dock">
        <div class="dock-status">
            <span class="status-dot"></span>
            <span id="loading-text" data-i18n="loadingDefault">Loading...</span>
        </div>

        <div class="dock-progress">
            <div class="progress-bar">
                <div class="progress-ticks" aria-hidden="true"></div>
                <div class="progress" id="progress"></div>
            </div>
        </div>

        <div class="dock-meta">
            <span id="loading-percentage">0%</span>
            <span class="dock-divider" aria-hidden="true"></span>
            <span class="dock-hint"><kbd>SPACE</kbd><span data-i18n="musicHint">Music</span></span>
            <i class="fa-solid fa-volume-high" id="volume-icon"></i>
        </div>
    </div>

    <audio id="bg-music" loop></audio>

    <script src="js/lang.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
